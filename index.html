<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estetista Indipendente — ti porto sul sito</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f8fb;
      color: #1c2333;
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a { color: #16233f; }
  </style>
</head>
<body>
  <div>
    <p>Il sito ora è Estetista Indipendente.<br>Ti porto lì…</p>
    <p><a id="destinazione" href="https://estetista-indipendente.com/">Vai a Estetista Indipendente</a></p>
  </div>

  <script>
    // I link mandati ai centri (una lezione, un corso, il link di recupero
    // password) arrivano ancora qui: la parte dopo il # va portata di là
    // pari pari, altrimenti si aprirebbe la pagina sbagliata.
    // Chi arriva sulla home dell'Academy vuole i corsi, non l'agenda.
    //
    // Questa pagina è anche la destinazione FISSA che la edge function
    // recovery-link scrive dentro i link di recupero password. È un indirizzo
    // github.io, quindi non muore quando cambia il dominio del sito: al
    // prossimo trasloco si cambia una riga qui e i link continuano ad
    // arrivare a destinazione, compresi quelli già partiti su WhatsApp.
    var hash = location.hash;
    if (!hash || hash === "#" || hash === "#/") hash = "#/corsi";
    var destinazione = "https://estetista-indipendente.com/" + hash;
    document.getElementById("destinazione").href = destinazione;
    location.replace(destinazione);
  </script>
</body>
</html>
