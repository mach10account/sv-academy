<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SV Academy si è spostata</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f8fb;
      color: #1c2333;
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a { color: #16233f; }
  </style>
</head>
<body>
  <div>
    <p>I corsi ora stanno insieme all'agenda.<br>Ti porto lì…</p>
    <p><a id="destinazione" href="https://agenda.salone-vincente.com/">Vai a Salone Vincente</a></p>
  </div>

  <script>
    // I link mandati ai centri (una lezione, un corso, il link di recupero
    // password) arrivano ancora qui: la parte dopo il # va portata di là
    // pari pari, altrimenti si aprirebbe la pagina sbagliata.
    // Chi arriva sulla home dell'Academy vuole i corsi, non l'agenda.
    var hash = location.hash;
    if (!hash || hash === "#" || hash === "#/") hash = "#/corsi";
    var destinazione = "https://agenda.salone-vincente.com/" + hash;
    document.getElementById("destinazione").href = destinazione;
    location.replace(destinazione);
  </script>
</body>
</html>
